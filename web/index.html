<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Touring diary</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%23b5552f'/%3E%3Cpath d='M8 21l5-8 4 5 3-3 4 6z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="vendor/markercluster/MarkerCluster.css">
  <link rel="stylesheet" href="vendor/markercluster/MarkerCluster.Default.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="trip-head">
      <h1 class="trip-title" id="trip-title">Touring diary</h1>
      <p class="trip-summary" id="trip-summary"></p>
    </div>
    <nav class="day-chips" id="day-chips" aria-label="Days"></nav>
  </header>
  <main class="layout">
    <aside class="timeline" id="timeline" aria-label="Timeline">
      <button class="sheet-handle" id="sheet-handle" type="button" aria-label="Expand timeline" aria-expanded="false"><span></span></button>
      <div class="timeline-scroll" id="timeline-scroll">
        <p class="loading">Loading trip…</p>
      </div>
    </aside>
    <div class="map-area">
      <div class="map" id="map" role="region" aria-label="Map"></div>
      <div class="scrubber" id="scrubber" role="group" aria-label="Time scrubber">
        <button class="scrub-btn scrub-play" id="scrub-play" type="button" aria-label="Play">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path class="i-play" d="M4.5 2.8v10.4L13 8z"/><path class="i-pause" d="M4 3h3v10H4zM9 3h3v10H9z"/></svg>
        </button>
        <input class="scrub-range" id="scrub-range" type="range" min="0" max="1" step="60" value="1" aria-label="Moment in the trip">
        <output class="scrub-readout" id="scrub-readout" aria-live="off"></output>
        <select class="scrub-speed" id="scrub-speed" aria-label="Playback speed" title="Playback speed (1× = 1 trip hour per 2 s)">
          <option value="0.5">½×</option>
          <option value="1" selected>1×</option>
          <option value="2">2×</option>
          <option value="4">4×</option>
        </select>
        <button class="scrub-btn scrub-follow" id="scrub-follow" type="button" aria-pressed="false" aria-label="Follow position on the map" title="Follow: keep the position in view">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="4.2"/><path d="M8 1v3M8 12v3M1 8h3M12 8h3"/></svg>
        </button>
        <button class="scrub-btn scrub-reset" id="scrub-reset" type="button" aria-label="Show everything (reset time)" title="Show everything">×</button>
      </div>
      <section class="profile" id="profile" aria-label="Elevation profile">
        <header class="profile-head">
          <h2 class="profile-title">Elevation</h2>
          <p class="profile-summary" id="profile-summary"></p>
          <p class="profile-legend" id="profile-legend"></p>
          <button class="profile-toggle" id="profile-toggle" type="button" aria-expanded="true" aria-controls="profile-body" aria-label="Hide elevation profile">▼</button>
        </header>
        <div class="profile-body" id="profile-body">
          <svg class="profile-svg" id="profile-svg" role="img" aria-label="Elevation profile"></svg>
          <div class="profile-readout" id="profile-readout" hidden></div>
          <p class="profile-empty" id="profile-empty" hidden>No tracks recorded</p>
        </div>
      </section>
    </div>
  </main>
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
    <div class="lb-stage" id="lb-stage"></div>
    <button class="lb-btn lb-close" id="lb-close" type="button" aria-label="Close (Esc)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <button class="lb-btn lb-nav lb-prev" id="lb-prev" type="button" aria-label="Previous (←)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="lb-btn lb-nav lb-next" id="lb-next" type="button" aria-label="Next (→)">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
    </button>
    <div class="lb-bar">
      <div class="lb-text">
        <p class="lb-when" id="lb-when"></p>
        <p class="lb-caption" id="lb-caption"></p>
        <p class="lb-approx" id="lb-approx"></p>
      </div>
      <div class="lb-side">
        <span class="lb-count" id="lb-count"></span>
        <a class="lb-full" id="lb-full" target="_blank" rel="noopener">Open full size</a>
      </div>
      <div class="lb-mini" id="lb-mini" aria-hidden="true"></div>
    </div>
  </div>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/markercluster/leaflet.markercluster.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
